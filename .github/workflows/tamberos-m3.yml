name: TamberOS M3 Wayland desktop
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    working-directory: TamberOS
permissions:
  contents: read
jobs:
  wayland-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-wayland-dev qt6-wayland-private-dev qt6-wayland qml6-module-qtqml qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qt-labs-settings libglib2.0-dev libqt6svg6 extra-cmake-modules libwayland-dev libxkbcommon-dev wayland-protocols sway grim wtype foot dbus-x11
      - name: Build pinned Qt layer-shell and Tamber desktop
        run: |
          bash scripts/build_layer_shell.sh
          cmake -S shell/tamber-shell -B build/shell -G Ninja -DTAMBER_WAYLAND_SESSION=ON -DCMAKE_PREFIX_PATH="$PWD/build/session-deps" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shell --parallel 2
      - name: Offline checks
        run: sh scripts/ci.sh
      - name: Real headless Wayland session and application interaction
        run: dbus-run-session python3 scripts/test_wayland_session.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-wayland-runtime
          path: |
            TamberOS/build/m3-evidence/
            TamberOS/build/shell/*.png
          if-no-files-found: error
