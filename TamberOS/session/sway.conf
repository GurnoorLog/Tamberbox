# TamberOS development session. Load explicitly; never replaces a user config.
xwayland disable
output * bg #202126 solid_color
font pango:Sans 10
seat seat0 hide_cursor 3000
default_border pixel 2
client.focused #ee9466 #29292e #f1ece2 #ee9466 #ee9466
client.unfocused #454047 #25252a #aaa6a4 #454047 #454047
gaps inner 12
floating_modifier Mod4 normal
bindsym Mod4+Return exec foot
bindsym Mod4+space exec tamber-desktop --command launcher
bindsym Mod4+comma exec tamber-desktop --command controls
bindsym Mod4+q kill
bindsym Mod4+f fullscreen toggle
bindsym Mod4+Shift+space floating toggle
bindsym Mod4+Tab focus next
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3
bindsym Mod4+4 workspace number 4
bindsym Mod4+Shift+e exit
exec tamber-desktop
