name: TamberOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sh scripts/ci.sh
  arm64-shell:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build and test against a real X11 server in an isolated ARM64 container
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          sleep 2
          docker run --rm -v "$PWD:/work" -v /tmp/.X11-unix:/tmp/.X11-unix \
            -e DISPLAY=:99 -e QT_QUICK_BACKEND=software -e QT_QUICK_CONTROLS_STYLE=Basic \
            almalinux@sha256:838c2fafefb1a8a0d7f8cdbc3b0551c2a2b1eb0cd87aad6d62aecadb18311f1b bash /work/scripts/test_shell_container.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tamber-shell-runtime
          path: build/shell/*.png
          if-no-files-found: warn
